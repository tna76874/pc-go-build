name: Build and Release

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GOOS: linux
            GOARCH: amd64
            name: linux-amd64
            ext: ""
          - GOOS: windows
            GOARCH: amd64
            name: windows-amd64
            ext: ".exe"

    steps:
      - name: Checkout external repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          github-server-url: ${{ secrets.REPO_HOST }}
          token: ${{ secrets.REPO_TOKEN }}
          ref: ${{ secrets.BUILD_REF }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Set up .NET (for WiX v4 MSI build)
        if: matrix.GOOS == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX v4 Tool
        if: matrix.GOOS == 'windows'
        run: dotnet tool install --global wix

      - name: Tidy dependencies
        run: go mod tidy

      - name: Build Go binary
        run: |
          mkdir -p dist
          # Build binary directly into root as expected by installer.wxs
          go build -v -o proxy-chain${{ matrix.ext }} .
          # Copy to dist with standard naming convention
          cp proxy-chain${{ matrix.ext }} dist/proxy-chain-${{ matrix.name }}${{ matrix.ext }}
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          CGO_ENABLED: 0

      - name: Build MSI Installer (Windows only)
        if: matrix.GOOS == 'windows'
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Build MSI using the wix tool and installer.wxs
          wix build installer.wxs -o dist/proxy-chain-${{ matrix.name }}.msi

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/proxy-chain-*
          tag_name: latest
          name: "Latest Build"
          body: "Automatischer Build (inkl. MSI-Paket)"
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
