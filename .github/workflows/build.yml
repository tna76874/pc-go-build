name: Build and Release

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - GOOS: linux
            GOARCH: amd64
            name: linux-amd64
            ext: ""
          - GOOS: windows
            GOARCH: amd64
            name: windows-amd64
            ext: ".exe"

    steps:
      - name: Checkout external repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.BUILD_REPO }}
          github-server-url: ${{ secrets.REPO_HOST }}
          token: ${{ secrets.REPO_TOKEN }}
          ref: ${{ secrets.BUILD_REF }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Tidy dependencies
        run: go mod tidy

      - name: Build Go binary
        run: |
          mkdir -p dist
          go build -v -o dist/proxy-chaine-go-${{ matrix.name }}${{ matrix.ext }} .
        env:
          GOOS: ${{ matrix.GOOS }}
          GOARCH: ${{ matrix.GOARCH }}
          CGO_ENABLED: 0

      - name: Create or Update Latest Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/proxy-chaine-go-*
          tag_name: latest
          name: "Latest Build"
          body: "Automatischer Build"
          make_latest: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
